<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТОЭ — Тест по Теоретическим Основам Электротехники</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Mono:wght@400;500&display=swap');
        
        :root {
            --primary: #2563eb;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
            color: #1e2937;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        
        .subtitle {
            opacity: 0.95;
            font-size: 1.1rem;
        }
        
        .quiz-container {
            padding: 2rem;
        }
        
        .question-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.8rem;
            transition: all 0.3s ease;
        }
        
        .question-card:hover {
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            transform: translateY(-2px);
        }
        
        .question-number {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }
        
        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #1e2937;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .option {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .option:hover {
            border-color: #60a5fa;
            background: #f0f9ff;
        }
        
        .option input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--primary);
        }
        
        .result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #ecfdf5;
            border: 2px solid #10b981;
            border-radius: 12px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #065f46;
        }
        
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }
        
        .footer {
            text-align: center;
            padding: 1.5rem;
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.95rem;
        }
        
        .correct {
            border-color: #34d399 !important;
            background: #f0fdf4 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Тест по ТОЭ</h1>
            <p class="subtitle">Теоретические основы электротехники</p>
        </header>
        
        <div class="quiz-container" id="quiz">
            <!-- Вопросы будут вставлены через JavaScript -->
        </div>
        
        <div class="footer">
            Подготовка к экзамену • ТОЭ
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                text: "Какой тип проводимости у металлов?",
                options: ["Электронная проводимость", "Ионная проводимость", "Дырочная проводимость", "Электролитическая"],
                answer: 0
            },
            {
                id: 2,
                text: "Какой закон отражает сохранение энергии в цепи?",
                options: ["Закон Ома", "Баланс мощностей", "Первый закон Кирхгофа", "Второй закон Кирхгофа"],
                answer: 1
            },
            {
                id: 3,
                text: "Как называется совокупность векторов ЭДС, напряжений и токов, изображённых в общей системе координат?",
                options: ["Фазорная диаграмма", "Векторная диаграмма", "График мгновенных значений", "Схема замещения"],
                answer: 1
            },
            {
                id: 4,
                text: "Как называется значение синусоидальной функции в любой момент времени?",
                options: ["Амплитудное значение", "Действующее значение", "Мгновенное значение", "Среднее значение"],
                answer: 2
            },
            {
                id: 5,
                text: "Чему равно среднее арифметическое значение величины за полпериода?",
                options: ["Нулю", "2/π Um", "Um", "√2 Um"],
                answer: 1
            },
            {
                id: 6,
                text: "Какая величина характеризует напряжение в данный момент времени?",
                options: ["Действующее значение", "Амплитуда", "Мгновенное значение", "Среднее значение"],
                answer: 2
            },
            {
                id: 7,
                text: "Как называется интервал времени полного цикла изменения ЭДС?",
                options: ["Частота", "Период", "Фаза", "Угловая частота"],
                answer: 1
            },
            {
                id: 8,
                text: "Электрический ток, неизменный по направлению и величине, — это...",
                options: ["Переменный ток", "Пульсирующий ток", "Постоянный ток", "Синусоидальный ток"],
                answer: 2
            },
            {
                id: 9,
                text: "Векторная величина, равная пределу отношения тока сквозь элемент поверхности, перпендикулярной направлению движения заряженных частиц, к этому элементу, — это...",
                options: ["Напряжённость поля", "Электродвижущая сила", "Плотность тока", "Сопротивление"],
                answer: 2
            },
            {
                id: 10,
                text: "Физическая величина, характеризующая скорость передачи или преобразования электрической энергии, — это...",
                options: ["Энергия", "Мощность", "Напряжение", "Сила тока"],
                answer: 1
            },
            {
                id: 11,
                text: "Отношение мощности приемника к мощности источника энергии — это...",
                options: ["Коэффициент мощности", "КПД", "Сопротивление", "Проводимость"],
                answer: 1
            },
            {
                id: 12,
                text: "Совокупность соединенных проводами элементов, образующая путь для протекания электрического тока — это...",
                options: ["Контур", "Ветвь", "Электрическая цепь", "Узел"],
                answer: 2
            },
            {
                id: 13,
                text: "Графическое изображение электрической цепи, где реальные элементы представлены условными обозначениями, — это...",
                options: ["Векторная диаграмма", "Схема электрической цепи", "График зависимости", "Эквивалентная схема"],
                answer: 1
            },
            {
                id: 14,
                text: "Сколько уравнений по первому закону Кирхгофа составляют для схемы с «y» узлами?",
                options: ["y", "y-1", "y+1", "2y"],
                answer: 1
            },
            {
                id: 15,
                text: "Какой прибор измеряет напряжение?",
                options: ["Амперметр", "Вольтметр", "Ваттметр", "Омметр"],
                answer: 1
            }
            // Можно добавить остальные вопросы по аналогии
        ];

        function renderQuiz() {
            const container = document.getElementById('quiz');
            let html = '<h2 style="margin-bottom: 1.5rem; text-align: center; color: #1e40af;">Контрольные вопросы</h2>';
            
            questions.forEach((q, index) => {
                html += `
                    <div class="question-card">
                        <div class="question-number">Вопрос ${q.id}</div>
                        <div class="question-text">${q.text}</div>
                        <div class="options" id="options-${q.id}">
                            ${q.options.map((option, i) => `
                                <label class="option">
                                    <input type="radio" name="q${q.id}" value="${i}">
                                    <span>${option}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            html += `
                <button onclick="checkAnswers()">Проверить результаты</button>
                <div class="result" id="result"></div>
            `;
            
            container.innerHTML = html;
        }
        
        function checkAnswers() {
            let score = 0;
            let total = questions.length;
            
            questions.forEach(q => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                if (selected && parseInt(selected.value) === q.answer) {
                    score++;
                }
            });
            
            const resultEl = document.getElementById('result');
            const percentage = Math.round((score / total) * 100);
            
            resultEl.style.display = 'block';
            resultEl.innerHTML = `
                <strong>Ваш результат: ${score} из ${total} (${percentage}%)</strong><br>
                ${percentage >= 80 ? 'Отлично! 🎉' : percentage >= 60 ? 'Хорошо! 👍' : 'Нужно подучить 📚'}
            `;
            
            // Прокрутка к результату
            resultEl.scrollIntoView({ behavior: "smooth" });
        }
        
        // Запуск
        window.onload = renderQuiz;
    </script>
</body>
</html>
